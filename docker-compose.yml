# =============================================================================
# Trinova AI — Local Development Docker Compose
# =============================================================================
# Usage:
#   1. Copy .env.example to .env and fill in your real values
#   2. docker compose up --build
#
# Environment variables are injected at runtime via env_file — they are
# NEVER baked into the image.  The .env file is gitignored and dockerignored.
# =============================================================================

services:
  trinova-ai:
    build:
      context: .
      dockerfile: Dockerfile
    image: trinova-ai:local

    # ------------------------------------------------------------------
    # Runtime environment injection
    # ------------------------------------------------------------------
    env_file:
      - .env                          # must exist locally (copied from .env.example)

    environment:
      # Backend API — required
      - INVENTORY_API_BASE_URL=${INVENTORY_API_BASE_URL:-}
      # Auth — optional
      - API_KEY=${API_KEY:-}
      # HTTP client tuning — optional
      - REQUEST_TIMEOUT=${REQUEST_TIMEOUT:-30}
      - MAX_RETRIES=${MAX_RETRIES:-3}
      - RETRY_BACKOFF=${RETRY_BACKOFF:-1.0}
      # App config
      - PORT=8080

    ports:
      - "8080:8080"

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
