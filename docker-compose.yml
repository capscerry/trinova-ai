# =============================================================================
# Trinova AI — Local Development Docker Compose
# =============================================================================
# Usage:
#   1. Copy .env.example to .env and fill in your real values (if any)
#   2. docker compose up --build
#
# The Inventory AI accepts forecast data via POST /forecast.
# It does not connect to the ASP.NET backend — the backend calls this service.
# =============================================================================

services:
  trinova-ai:
    build:
      context: .
      dockerfile: Dockerfile
    image: trinova-ai:local

    environment:
      - PORT=8080

    ports:
      - "8080:8080"

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
